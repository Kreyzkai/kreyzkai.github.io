<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watching Worlds · Jeopardy（全16レッスン）</title>
<link rel="icon" href="data:,">
<style>
:root{
  --ink:#070b1e; --ink2:#0e1430; --ink3:#151c3d;
  --line:rgba(255,255,255,.13); --line2:rgba(255,255,255,.22);
  --text:#eef2ff; --muted:#93a1cd; --gold:#ffcc5c; --gold2:#ffa62b;
  --ok:#39d98a; --okbg:rgba(57,217,138,.16);
  --no:#ff6b8a; --nobg:rgba(255,107,138,.16);
  --accent:#4cc9f0;
  --font:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:#070b1e}
body{
  font-family:var(--font); color:var(--text); min-height:100vh;
  background:#070b1e;
  overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(1100px 600px at 12% -10%, rgba(76,201,240,.16), transparent 60%),
    radial-gradient(900px 500px at 92% 8%, rgba(255,166,43,.13), transparent 60%),
    radial-gradient(1000px 700px at 50% 115%, rgba(120,90,255,.16), transparent 65%),
    linear-gradient(180deg,#0a1030 0%, #070b1e 45%, #04060f 100%);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(circle at 50% 30%, #000 20%, transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 30%, #000 20%, transparent 78%);
}
.wrap{position:relative; z-index:1; max-width:1280px; margin:0 auto; padding:22px 20px 70px}

/* ---------- generic ---------- */
button{font-family:inherit; color:inherit; border:none; background:none; cursor:pointer}
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:999px;
  background:rgba(255,255,255,.07); border:1px solid var(--line); color:var(--text);
  font-size:15px; font-weight:700; letter-spacing:.02em; transition:.18s;
}
.btn:hover{background:rgba(255,255,255,.14); border-color:var(--line2); transform:translateY(-1px)}
.btn.back{background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#26180a; border:none;
  box-shadow:0 6px 20px rgba(255,166,43,.32)}
.btn.back:hover{filter:brightness(1.07)}

/* ---------- splash ---------- */
.hero{text-align:center; padding:26px 0 6px}
.globe{
  width:82px;height:82px;margin:0 auto 12px;border-radius:50%;
  background:conic-gradient(from 200deg,#4cc9f0,#4361ee,#7209b7,#f72585,#ffa62b,#4cc9f0);
  display:grid;place-items:center;font-size:40px;
  box-shadow:0 0 0 6px rgba(255,255,255,.06), 0 18px 50px rgba(76,201,240,.35);
  animation:spin 24s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.globe span{animation:spin 24s linear infinite reverse; display:block}
.kicker{
  font-size:13px; letter-spacing:.34em; font-weight:800; color:var(--gold); text-transform:uppercase;
}
h1{
  font-size:clamp(34px,6.2vw,64px); font-weight:900; letter-spacing:-.02em; line-height:1.04;
  margin:6px 0 6px;
  background:linear-gradient(180deg,#ffffff 25%, #a9c0ff 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 20px 60px rgba(120,160,255,.25);
}
.jptitle{font-size:clamp(15px,2.3vw,21px); color:var(--muted); font-weight:700}
.howto{
  display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:22px auto 8px; max-width:960px;
}
.chip{
  background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:999px;
  padding:9px 16px; font-size:13.5px; color:#cdd7f7; font-weight:600;
}
.chip b{color:var(--gold)}
.sectlabel{
  margin:34px 0 14px; display:flex; align-items:center; gap:14px; color:var(--muted);
  font-size:13px; letter-spacing:.24em; font-weight:800; text-transform:uppercase;
}
.sectlabel::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent)}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:16px}
.unit{
  position:relative; overflow:hidden; text-align:left;
  border-radius:22px; padding:20px 18px 18px;
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
  border:1px solid var(--line);
  transition:transform .2s, box-shadow .2s, border-color .2s;
  min-height:196px; display:flex; flex-direction:column;
}
.unit::after{
  content:""; position:absolute; inset:-40% -60% auto auto; width:200px; height:200px; border-radius:50%;
  background:radial-gradient(circle,var(--ua),transparent 62%); opacity:.55; transition:.25s;
}
.unit:hover{transform:translateY(-5px); border-color:var(--ub); box-shadow:0 22px 50px rgba(0,0,0,.5), 0 0 0 1px var(--ub) inset}
.unit:hover::after{opacity:.9}
.unit .flag{font-size:40px; line-height:1; filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.unit .num{
  position:absolute; top:16px; right:16px; font-size:11.5px; font-weight:900; letter-spacing:.14em;
  color:#0a0f24; background:linear-gradient(135deg,var(--gold),var(--gold2)); padding:5px 10px; border-radius:8px;
}
.unit h3{font-size:19px; font-weight:900; margin:12px 0 3px; line-height:1.22; letter-spacing:-.01em}
.unit .jp{font-size:13.5px; color:var(--muted); font-weight:700; line-height:1.4}
.unit .meta{margin-top:auto; padding-top:14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.unit .meta .pg{font-size:11.5px; color:#7e8cb8; font-weight:700; margin-left:auto}
.ic{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:rgba(255,255,255,.08); border:1px solid var(--line);
}
.play{
  margin-top:14px; display:flex; align-items:center; justify-content:space-between;
  font-size:13px; font-weight:900; color:var(--gold); letter-spacing:.06em;
}

/* ---------- board ---------- */
.topbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px;
}
.topbar .ident{display:flex; align-items:center; gap:13px; min-width:0}
.topbar .ident .fl{font-size:36px; line-height:1}
.topbar .ident .tx{min-width:0}
.topbar .ident h2{font-size:clamp(19px,3vw,27px); font-weight:900; letter-spacing:-.01em; line-height:1.15}
.topbar .ident .sub{font-size:13px; color:var(--muted); font-weight:700; margin-top:2px}
.topbar .spacer{flex:1}

.boardwrap{
  border-radius:26px; padding:16px; border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
  box-shadow:0 26px 70px rgba(0,0,0,.5);
  display:flex; flex-direction:column; gap:14px;
  min-height:calc(100vh - 210px);
}
.board{
  display:grid; grid-template-columns:repeat(4,1fr); gap:12px; flex:1;
  grid-template-rows:auto repeat(3,minmax(78px,1fr));
}
.cathead{
  border-radius:16px; padding:14px 12px; text-align:center; min-height:106px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border:1px solid var(--line); border-top:3px solid var(--accent);
}
.cathead .ci{font-size:24px; line-height:1}
.cathead .cn{font-size:14.5px; font-weight:900; letter-spacing:.03em; line-height:1.2}
.cathead .cj{font-size:11.5px; color:var(--muted); font-weight:700}
.tile{
  position:relative; overflow:hidden; border-radius:16px; min-height:78px;
  display:grid; place-items:center; cursor:pointer; transition:.18s;
  background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  border:1px solid var(--line);
}
.tile .pts{
  font-size:clamp(26px,3.6vw,40px); font-weight:900; letter-spacing:-.02em;
  background:linear-gradient(180deg,#fff,#ffd97a);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.tile .lbl{font-size:9.5px; letter-spacing:.3em; color:var(--muted); font-weight:800; margin-top:2px}
.tile:hover{transform:translateY(-4px); border-color:var(--accent);
  box-shadow:0 16px 40px rgba(0,0,0,.5), 0 0 26px -6px var(--accent)}
.tile:active{transform:translateY(-1px)}
.tile.done{cursor:default; background:rgba(255,255,255,.028); border-color:rgba(255,255,255,.07)}
.tile.done .pts{background:none; -webkit-text-fill-color:rgba(255,255,255,.16); color:rgba(255,255,255,.16)}
.tile.done:hover{transform:none; box-shadow:none; border-color:rgba(255,255,255,.07)}
.tile.done::after{content:"✓"; position:absolute; font-size:24px; color:rgba(57,217,138,.5); font-weight:900}

.prog{display:flex; align-items:center; gap:14px; flex-wrap:wrap; flex:0 0 auto}
.bar{flex:1; min-width:180px; height:9px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden}
.bar i{display:block; height:100%; width:0; border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--gold)); transition:width .35s}
.pgtxt{font-size:13px; font-weight:800; color:var(--muted)}

/* ---------- modal ---------- */
.scrim{
  position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
  padding:24px 18px; background:rgba(3,5,16,.76); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
}
.scrim.on{display:flex; animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{
  width:100%; max-width:900px; max-height:92vh; overflow-y:auto; border-radius:26px;
  background:linear-gradient(170deg,#161e46,#0b1130 70%);
  border:1px solid var(--line2); box-shadow:0 40px 90px rgba(0,0,0,.7);
  animation:pop .26s cubic-bezier(.2,1.1,.4,1);
}
@keyframes pop{from{opacity:0; transform:translateY(22px) scale(.97)}to{opacity:1; transform:none}}
.card .head{
  display:flex; align-items:center; gap:12px; padding:16px 22px;
  border-bottom:1px solid var(--line); background:rgba(255,255,255,.045);
  border-radius:26px 26px 0 0; position:sticky; top:0; backdrop-filter:blur(8px); z-index:2;
}
.card .head .ci{font-size:22px}
.card .head .cn{font-size:14px; font-weight:900; letter-spacing:.05em}
.card .head .cj{font-size:11.5px; color:var(--muted); font-weight:700}
.card .head .pt{
  margin-left:auto; font-size:15px; font-weight:900; color:#231604;
  background:linear-gradient(135deg,var(--gold),var(--gold2)); padding:7px 15px; border-radius:999px;
}
.card .body{padding:26px 24px 24px}
.qtext{
  font-size:clamp(20px,3.2vw,31px); font-weight:900; line-height:1.35; letter-spacing:-.01em; text-align:center;
}
.qjp{margin-top:12px; text-align:center; font-size:15px; color:var(--muted); font-weight:700; line-height:1.6}
.readbtn{
  margin:18px auto 0; display:flex; align-items:center; gap:9px; padding:10px 18px; border-radius:999px;
  background:rgba(76,201,240,.14); border:1px solid rgba(76,201,240,.45); color:#bde9ff;
  font-size:14px; font-weight:800;
}
.readbtn:hover{background:rgba(76,201,240,.24)}
.opts{margin-top:24px; display:grid; gap:12px}
.opt{
  display:flex; align-items:center; gap:15px; text-align:left; width:100%;
  padding:17px 20px; border-radius:17px; border:1px solid var(--line2);
  background:linear-gradient(150deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
  font-size:clamp(16px,2.2vw,20px); font-weight:700; line-height:1.4; transition:.16s;
}
.opt .key{
  flex:0 0 36px; height:36px; border-radius:11px; display:grid; place-items:center;
  background:rgba(255,255,255,.12); font-weight:900; font-size:15px; color:var(--gold);
}
.opt:hover:not(.locked){transform:translateX(5px); border-color:var(--accent); background:rgba(76,201,240,.13)}
.opt.locked{cursor:default}
.opt.ok{background:var(--okbg); border-color:var(--ok)}
.opt.ok .key{background:var(--ok); color:#04170e}
.opt.no{background:var(--nobg); border-color:var(--no); opacity:.85}
.opt.no .key{background:var(--no); color:#22060d}
.result{margin-top:22px; padding:20px; border-radius:18px; border:1px solid var(--line2); background:rgba(255,255,255,.05)}
.result .verdict{display:flex; align-items:center; gap:11px; font-size:23px; font-weight:900}
.result.is-ok .verdict{color:var(--ok)}
.result.is-no .verdict{color:var(--gold)}
.result .note{margin-top:12px; font-size:15.5px; line-height:1.75; color:#d5defb; font-weight:600}
.result .en{
  margin-top:14px; padding:14px 16px; border-radius:14px; background:rgba(0,0,0,.3);
  border-left:4px solid var(--accent); font-size:17px; font-weight:800; line-height:1.5;
  display:flex; align-items:center; gap:12px;
}
.result .en .sp{flex:1}
.mini{
  flex:0 0 38px; height:38px; border-radius:12px; display:grid; place-items:center; font-size:17px;
  background:rgba(76,201,240,.18); border:1px solid rgba(76,201,240,.45);
}
.mini:hover{background:rgba(76,201,240,.3)}
.cardfoot{display:flex; gap:12px; justify-content:flex-end; margin-top:22px; flex-wrap:wrap}
.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#26180a; border:none; font-weight:900}
.shake{animation:sh .42s}
@keyframes sh{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}

/* ---------- teacher key ---------- */
.keylist{display:grid; gap:12px; margin-top:6px}
.keyrow{border:1px solid var(--line); border-radius:16px; padding:15px 17px; background:rgba(255,255,255,.045)}
.keyrow .kh{font-size:12px; font-weight:900; letter-spacing:.14em; color:var(--gold); margin-bottom:7px}
.keyrow .kq{font-size:16px; font-weight:800; line-height:1.45}
.keyrow .kp{font-size:13px; color:var(--muted); font-weight:700; margin-top:4px}
.keyrow .ka{font-size:16.5px; font-weight:900; color:var(--ok); margin-top:9px; line-height:1.45}
.keyrow .kn{font-size:13.5px; color:#b9c5e8; margin-top:5px; line-height:1.6}
.keycat{margin-top:24px; font-size:15px; font-weight:900; color:var(--accent); letter-spacing:.05em;
  padding-bottom:8px; border-bottom:1px solid var(--line)}

@media (max-width:760px){
  .board{grid-template-columns:repeat(2,1fr)}
  .cathead{min-height:64px}
  .cathead .cn{font-size:12px}
  .tile{min-height:64px}
  .topbar{gap:10px}
  .wrap{padding:16px 13px 60px}
  .card .body{padding:20px 16px}
  .unit{min-height:0}
}
@media print{
  body{background:#fff; color:#000}
  .topbar,.cardfoot,.scrim{display:none}
}
</style>
</head>

const PTS = [100,200,300];
const $ = (s,r=document)=>r.querySelector(s);
const mk=(t,c,x)=>{const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;};
const done = {};   // lessonId -> Set of "ci-ri"
let cur = null;
let voices = [];

try{ if('speechSynthesis' in window){ const g=()=>voices=speechSynthesis.getVoices(); g(); speechSynthesis.onvoiceschanged=g; } }catch(e){}

function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=.82; u.pitch=1;
    const v = voices.find(x=>/^en(-|_)?(US|GB)?/i.test(x.lang) && /female|samantha|zira|google us/i.test(x.name))
           || voices.find(x=>/^en/i.test(x.lang));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= SPLASH ================= */
function splash(){
  const v = $('#view');
  v.innerHTML='';
  const hero = mk('div','hero');
  hero.innerHTML = '<div class="globe"><span>🌍</span></div>'
    + '<div class="kicker">Watching Worlds · Jeopardy</div>'
    + '<h1>World Cultures Quiz Show</h1>'
    + '<div class="jptitle">「Watching Worlds」全16レッスンの Jeopardy ゲーム</div>';

  const howto = mk('div','howto');
  [ ['1','国（レッスン）をえらぶ'], ['2','4つのカテゴリー × 3問'], ['3','グループで相談して答える'],
    ['4','得点なし・まちがえても OK'], ['5','← もどる でこの画面へ'] ].forEach(([n,t])=>{
    const c = mk('div','chip'); c.innerHTML = '<b>'+n+'</b>　'+t; howto.appendChild(c);
  });
  hero.appendChild(howto);
  v.appendChild(hero);

  const lab = mk('div','sectlabel', 'UNITS 1–13  ·  Countries');
  v.appendChild(lab);
  const g = mk('div','grid');
  DATA.slice(0,13).forEach(L=>g.appendChild(unitCard(L)));
  v.appendChild(g);

  const lab2 = mk('div','sectlabel', 'Special Lessons  ·  特別レッスン');
  v.appendChild(lab2);
  const g2 = mk('div','grid');
  DATA.slice(13).forEach(L=>g2.appendChild(unitCard(L)));
  v.appendChild(g2);
}

function unitCard(L){
  const b = mk('button','unit');
  b.style.setProperty('--ua', L.accent+'55');
  b.style.setProperty('--ub', L.accent);
  b.setAttribute('aria-label', L.title);
  const n = done[L.id] ? done[L.id].size : 0;
  b.innerHTML =
    '<div class="num">'+(L.num.match(/^\d+$/) ? 'UNIT '+L.num : L.country.toUpperCase())+'</div>'
    + '<div class="flag">'+L.flag+'</div>'
    + '<h3>'+esc(L.title)+'</h3>'
    + '<div class="jp">'+esc(L.jp)+'</div>'
    + '<div class="meta">'+L.cats.map(c=>'<span class="ic" title="'+esc(c.name)+'">'+c.icon+'</span>').join('')
    +   '<span class="pg">'+L.pages+'</span></div>'
    + '<div class="play">▶ '+(n?('つづきから（'+n+'/12）'):'ゲームをひらく')+'<span>'+L.cats.length*3+' もん</span></div>';
  b.addEventListener('click', ()=>board(L.id));
  return b;
}

function esc(s){return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

/* ================= BOARD ================= */
function board(id){
  cur = DATA.find(x=>x.id===id);
  if(!done[id]) done[id]=new Set();
  document.documentElement.style.setProperty('--accent', cur.accent);
  render();
  window.scrollTo({top:0,behavior:'instant'});
}

function render(){
  const v = $('#view'); v.innerHTML='';
  const top = mk('div','topbar');
  const back = mk('button','btn back','← もどる（国をえらぶ）');
  back.addEventListener('click', ()=>{ cur=null; document.documentElement.style.setProperty('--accent','#4cc9f0'); splash(); window.scrollTo({top:0}); });
  top.appendChild(back);
  const id = mk('div','ident');
  id.innerHTML = '<div class="fl">'+cur.flag+'</div><div class="tx"><h2>'
    + esc(cur.title)+'</h2><div class="sub">'
    + (cur.num.match(/^\d+$/) ? 'Unit '+cur.num+' · ' : '') + esc(cur.jp) + ' · ' + cur.pages + '</div></div>';
  top.appendChild(id);
  const sp = mk('div','spacer'); top.appendChild(sp);
  const key = mk('button','btn','📋 先生用（全問リスト）');
  key.addEventListener('click', teacherKey);
  const rst = mk('button','btn','↺ リセット');
  rst.addEventListener('click', ()=>{ done[cur.id].clear(); render(); });
  top.appendChild(key); top.appendChild(rst);
  v.appendChild(top);

  const bw = mk('div','boardwrap');
  const bd = mk('div','board');
  cur.cats.forEach(c=>{
    const h = mk('div','cathead');
    h.innerHTML = '<div class="ci">'+c.icon+'</div><div class="cn">'+esc(c.name)+'</div><div class="cj">'+esc(c.jp)+'</div>';
    bd.appendChild(h);
  });
  for(let r=0;r<3;r++){
    cur.cats.forEach((c,ci)=>{
      const used = done[cur.id].has(ci+'-'+r);
      const t = mk('button','tile'+(used?' done':''));
      t.innerHTML = '<div style="text-align:center"><div class="pts">'+PTS[r]+'</div><div class="lbl">POINTS</div></div>';
      if(!used) t.onclick = ()=>card(ci,r,t);
      bd.appendChild(t);
    });
  }
  bw.appendChild(bd);

  const pr = mk('div','prog');
  const n = done[cur.id].size;
  pr.innerHTML = '<div class="bar"><i style="width:'+(n/12*100)+'%"></i></div>'
    + '<div class="pgtxt">'+n+' / 12 もん　クリア！</div>';
  bw.appendChild(pr);
  v.appendChild(bw);
}

/* ================= CARD ================= */
function card(ci,ri,tile){
  const cat = cur.cats[ci], q = cat.cards[ri];
  const sc = $('#scrim'); sc.innerHTML='';
  const c = mk('div','card');
  const head = mk('div','head');
  head.innerHTML = '<div class="ci">'+cat.icon+'</div><div><div class="cn">'+esc(cat.name)+'</div>'
    + '<div class="cj">'+esc(cat.jp)+'</div></div><div class="pt">'+PTS[ri]+' てん</div>';
  c.appendChild(head);

  const body = mk('div','body');
  const qt = mk('div','qtext'); qt.textContent = q.q;
  body.appendChild(qt);
  if(q.jp){ const jp = mk('div','qjp'); jp.textContent = q.jp; body.appendChild(jp); }
  const rb = mk('button','readbtn','🔊 英語を聞く（Listen）');
  rb.addEventListener('click', ()=>speak(q.say));
  body.appendChild(rb);

  const opts = mk('div','opts');
  const keys=['A','B','C'];
  const btns = q.opts.map((o,i)=>{
    const b = mk('button','opt');
    b.innerHTML = '<span class="key">'+keys[i]+'</span><span>'+esc(o)+'</span>';
    b.addEventListener('click', ()=>answer(i, btns, q, ci, ri, tile, body));
    opts.appendChild(b); return b;
  });
  body.appendChild(opts);

  const foot = mk('div','cardfoot');
  const close = mk('button','btn','とじる ✕');
  close.addEventListener('click', closeCard);
  foot.appendChild(close);
  body.appendChild(foot);

  c.appendChild(body);
  sc.appendChild(c);
  sc.classList.add('on');
  sc.onclick = e => { if(e.target===sc) closeCard(); };
  sc.querySelector('.body').scrollTop = 0;
}

function closeCard(){ const sc=$('#scrim'); sc.classList.remove('on'); sc.innerHTML=''; }

function refreshProgress(){
  const n = done[cur.id].size;
  const bar = document.querySelector('.bar i'), txt = document.querySelector('.pgtxt');
  if(bar) bar.style.width = (n/12*100)+'%';
  if(txt) txt.textContent = n+' / 12 もん　クリア！';
}

function answer(pick, btns, q, ci, ri, tile, body){
  const correct = pick === q.a;
  btns.forEach((b,i)=>{
    b.classList.add('locked');
    b.onclick = null;
    if(i===q.a) b.classList.add('ok');
    else if(i===pick) b.classList.add('no');
  });
  if(!correct) btns[pick].classList.add('shake');

  const res = mk('div','result '+(correct?'is-ok':'is-no'));
  res.innerHTML = '<div class="verdict">'+(correct?'🎉 せいかい！':'💡 おしい！ 正解はこちら')+'</div>'
    + '<div class="en"><span class="sp">'+esc(q.say)+'</span>'
    + '<button class="mini" title="もう一度聞く">🔊</button></div>'
    + '<div class="note">'+esc(q.note)+'</div>';
  res.querySelector('.mini').addEventListener('click', ()=>speak(q.say));
  body.insertBefore(res, body.querySelector('.cardfoot'));
  setTimeout(()=>speak(q.say), 280);

  done[cur.id].add(ci+'-'+ri);
  if(tile){ tile.classList.add('done'); tile.onclick = null; }
  refreshProgress();
  try{ if(res.scrollIntoView) res.scrollIntoView({block:'nearest', behavior:'smooth'}); }catch(e){}
}

/* ================= TEACHER KEY ================= */
function teacherKey(){
  const sc = $('#scrim'); sc.innerHTML='';
  const c = mk('div','card');
  const head = mk('div','head');
  head.innerHTML = '<div class="ci">📋</div><div><div class="cn">先生用 全問リスト</div>'
    + '<div class="cj">'+esc(cur.title)+' · '+esc(cur.jp)+'</div></div>'
    + '<div class="pt">'+cur.pages+'</div>';
  c.appendChild(head);
  const body = mk('div','body');
  cur.cats.forEach((cat,ci)=>{
    const h = mk('div','keycat', (ci+1)+'. '+cat.icon+' '+cat.name+'　'+cat.jp);
    body.appendChild(h);
    const list = mk('div','keylist');
    cat.cards.forEach((q,ri)=>{
      const row = mk('div','keyrow');
      row.innerHTML = '<div class="kh">'+PTS[ri]+' POINTS</div>'
        + '<div class="kq">'+esc(q.q)+'</div>'
        + (q.jp?'<div class="kp">'+esc(q.jp)+'</div>':'')
        + '<div class="ka">✓ '+esc(q.say)+'</div>'
        + '<div class="kn">'+esc(q.note)+'</div>';
      list.appendChild(row);
    });
    body.appendChild(list);
  });
  const foot = mk('div','cardfoot');
  const pr = mk('button','btn','🖨️ 印刷する'); pr.addEventListener('click',()=>window.print());
  const cl = mk('button','btn','とじる ✕'); cl.addEventListener('click',()=>{sc.classList.remove('on'); sc.innerHTML='';});
  foot.appendChild(pr); foot.appendChild(cl);
  body.appendChild(foot);
  c.appendChild(body);
  sc.appendChild(c);
  sc.classList.add('on');
  sc.onclick = e => { if(e.target===sc){ sc.classList.remove('on'); sc.innerHTML=''; } };
}

/* ================= keys ================= */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ const sc=$('#scrim'); if(sc.classList.contains('on')){ sc.classList.remove('on'); sc.innerHTML=''; } }
});

splash();
