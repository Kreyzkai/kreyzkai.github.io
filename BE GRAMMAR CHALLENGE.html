<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar Challenge — Board Game (Lessons 1–9)</title>
<style>
  :root{
    --navy:#16233D; --body:#2C3B57; --muted:#64748B; --line:#D6E3F0;
    --gold:#E9C46A; --soft:0 18px 40px -24px rgba(16,32,60,.45);
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{
    margin:0;color:var(--body);
    font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",
                system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(900px 520px at 6% -14%, #FFFFFF 0%, rgba(255,255,255,0) 62%),
      radial-gradient(780px 470px at 104% 2%, #E1F0F4 0%, rgba(225,240,244,0) 58%),
      linear-gradient(180deg,#F8FBFE 0%, #E7EFF7 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.4;
    background-image:radial-gradient(#C6D6E7 1px, transparent 1.4px);
    background-size:26px 26px;
  }
  .wrap{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:14px 18px 26px;
        display:flex;flex-direction:column;gap:13px;min-height:100%}

  /* ------------------------------------------------ header */
  header{
    position:sticky;top:10px;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:9px 12px 9px 10px;border-radius:18px;border:1.5px solid #E2EDF7;
    background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
    box-shadow:0 10px 30px -18px rgba(16,32,60,.5);
  }
  .mark{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;
        background:linear-gradient(150deg,#1B2A44,#2E4A7A);box-shadow:0 6px 14px -8px #16233D}
  .mark svg{display:block}
  h1{font-size:19px;margin:0;color:var(--navy);letter-spacing:.1px;line-height:1.1}
  h1 small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:1.1px;
           text-transform:uppercase;margin-top:3px}
  .spacer{flex:1}
  button{
    font:inherit;font-weight:700;font-size:13px;color:var(--navy);background:#fff;
    border:1.5px solid var(--line);border-radius:12px;padding:9px 13px;cursor:pointer;
    transition:transform .13s ease, box-shadow .13s ease, background .13s ease, border-color .13s;
    display:inline-flex;align-items:center;gap:7px;
  }
  button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(16,32,60,.7);
                              border-color:#BFD3E6}
  button:active:not(:disabled){transform:translateY(0) scale(.99)}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:linear-gradient(180deg,#22355A,#16233D);color:#fff;border-color:#16233D;
                 box-shadow:0 10px 22px -14px #16233D}
  button.primary:hover:not(:disabled){box-shadow:0 14px 26px -14px #16233D}
  button.good{background:linear-gradient(180deg,#128074,#0B6357);color:#fff;border-color:#0B6357}
  button.bonus{background:linear-gradient(180deg,#9A6E08,#7C5703);color:#fff;border-color:#7C5703}
  button.bad{background:#fff;color:#B02448;border-color:#F1CAD3}
  .count{background:#EEF4FA;border-radius:999px;padding:1px 7px;font-size:11px;color:var(--navy)}

  main{display:grid;grid-template-columns:minmax(0,1fr) clamp(392px,31vw,478px);gap:14px;align-items:start}

  /* ------------------------------------------------ board */
  .board{position:relative;border-radius:24px;padding:10px;
         background:linear-gradient(180deg,#FFFFFF,#FAFDFF);
         border:1.5px solid #E2EDF7;box-shadow:var(--soft),inset 0 1px 0 #fff}
  svg#board{display:block;width:100%;height:auto;border-radius:16px}
  .cellInner{transform-origin:0 0}
  .cell{transition:opacity .25s ease,filter .25s ease}
  .cell .glow{opacity:0;transform-box:fill-box;transform-origin:center}
  @keyframes bump{
    0%{transform:scale(1)}
    26%{transform:scale(1.05)}
    48%{transform:scale(.985)}
    68%{transform:scale(1.015)}
    84%{transform:scale(.998)}
    100%{transform:scale(1)}
  }
  @keyframes glowPulse{0%{opacity:.95;transform:scale(.965)}100%{opacity:0;transform:scale(1.06)}}
  @keyframes passFlash{0%{opacity:.95}55%{opacity:.7}100%{opacity:0}}
  @keyframes passPop{0%{transform:scale(1)}34%{transform:scale(1.035)}100%{transform:scale(1)}}
  .cell.lit .cellInner{animation:bump .58s cubic-bezier(.22,.9,.3,1)}
  .cell.lit .glow{opacity:1;animation:glowPulse .9s ease-out}
  .cell.chase .glow{animation:passFlash .34s ease-out}
  .cell.chase .cellInner{animation:passPop .34s ease-out}
  #board.focus .cell:not(.lit){opacity:.5;filter:saturate(.55)}
  .cell.last .glow{opacity:.7}
  @keyframes chipIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  @keyframes halo{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:0;transform:scale(1.55)}}
  .halo{transform-origin:0 0;animation:halo 2.2s ease-in-out 999}
  @keyframes dieThrow{
    0%{transform:none}
    14%{transform:translateY(-10px) rotate(-10deg) scale(1.06)}
    32%{transform:translateY(1px) rotate(9deg) scale(.96,1.03)}
    48%{transform:translateY(-5px) rotate(-7deg) scale(1.02)}
    64%{transform:translateY(0) rotate(5deg) scale(.99)}
    80%{transform:translateY(-1px) rotate(-2deg) scale(1.06,.92)}
    92%{transform:scale(1.1,.9)}
    100%{transform:none}
  }
  #dieInner.throw{animation:dieThrow .78s cubic-bezier(.3,.8,.4,1);transform-origin:42px 42px}
  #board .slot{transition:opacity .3s ease,filter .3s ease}
  #board.focus .slot:not(.lit){opacity:.52;filter:saturate(.72)}
  @keyframes cardGlow{
    0%{box-shadow:0 0 0 0 transparent}
    32%{box-shadow:0 0 0 6px var(--glow,rgba(0,0,0,0))}
    100%{box-shadow:0 0 0 0 transparent}
  }
  .card.enter{animation:cardIn .32s cubic-bezier(.2,.85,.3,1),cardGlow .9s ease-out}
  .card.fly{animation:cardFly .52s cubic-bezier(.2,.85,.3,1)}
  @keyframes cardFly{
    0%{transform:translate(var(--fx,0px),var(--fy,0px)) scale(var(--fs,.32));opacity:.22}
    55%{opacity:1}
    100%{transform:none;opacity:1}
  }
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);z-index:60;
         background:#16233D;color:#fff;font-weight:700;font-size:13px;padding:11px 18px;
         border-radius:12px;box-shadow:0 16px 34px -18px #16233D;opacity:0;pointer-events:none;
         transition:opacity .2s,transform .2s;max-width:min(92vw,520px);text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  button{touch-action:manipulation}
  button:focus-visible{outline:3px solid #9CC2E8;outline-offset:2px}
  #fsBtn.on{background:#16233D;color:#fff;border-color:#16233D}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;scroll-behavior:auto !important}
  }
  .boardnote{margin:6px 2px 2px;text-align:center;font-size:11.5px;font-weight:600;color:#6B7A8F;
             letter-spacing:.1px}

  /* ------------------------------------------------ panel */
  .panel{display:flex;flex-direction:column;gap:10px;position:sticky;top:84px}
  .card{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:18px;
        overflow:hidden;display:flex;flex-direction:column;min-height:min(560px,62vh);
        box-shadow:var(--soft);transition:border-color .2s}
  .card.enter{animation:cardIn .32s cubic-bezier(.2,.85,.3,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .band{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;
        font-weight:800;font-size:12px;letter-spacing:1px;color:#fff;
        background:linear-gradient(180deg,var(--acc),var(--acc));box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)}
  .band .id{opacity:.85;letter-spacing:1.4px;font-size:11px}
  .band .bl{display:flex;align-items:center;gap:7px}
  .gl{display:inline-flex;align-items:center;justify-content:center}
  .gl svg{width:13px;height:13px;display:block}
  .body{padding:14px 16px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
  .pill{border:1.4px solid;border-radius:999px;padding:4px 14px;font-size:10.5px;font-weight:800;
        letter-spacing:.7px;background:#fff;text-align:center;box-shadow:0 2px 8px -6px rgba(16,32,60,.6)}
  .en{font-size:clamp(26px,2vw,34px);line-height:1.16;font-weight:800;color:var(--navy);text-align:center;
      letter-spacing:-.3px;margin:2px 0 0;word-break:break-word;max-width:34ch}
  .ja{font-size:14px;color:#5E6E85;text-align:center;line-height:1.5}
  .ja.hide{display:none}
  .artwrap{flex:1;display:flex;align-items:center;justify-content:center;
           margin:6px 14px 12px;padding:10px;min-height:130px;border-radius:14px;
           background:linear-gradient(180deg,#F7FBFE,#EBF3FA);border:1px solid #E2ECF6}
  .artwrap img{max-height:min(230px,24vh);max-width:94%;object-fit:contain;
               filter:drop-shadow(0 10px 16px rgba(22,35,61,.14))}
  .foot{padding:7px 15px 9px;border-top:1px dashed #E1EAF4;font-size:9.5px;font-weight:800;
        letter-spacing:1.2px;color:#9AA9BC;text-transform:uppercase;display:flex;justify-content:space-between}
  .answerwrap{padding:0 14px 14px;animation:ansIn .26s ease-out}
  @keyframes ansIn{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
  .answer{border:1.5px solid #CDE8DE;background:linear-gradient(180deg,#F4FCF9,#EBF8F4);
          border-radius:14px;padding:12px 15px;box-shadow:inset 0 1px 0 #fff}
  .alab{font-size:9.5px;font-weight:800;letter-spacing:1.2px;color:#7FA79B;margin:9px 0 1px}
  .alab:first-child{margin-top:2px}
  .answer h4{margin:0 0 6px;font-size:10px;letter-spacing:1px;color:#0E6E63;text-transform:uppercase}
  .answer .a{font-size:17.5px;font-weight:800;color:var(--navy);line-height:1.32}
  .answer .a+.a{margin-top:4px}
  .answer .alt{font-size:12.5px;color:#4B6B63;margin-top:8px}
  .answer .note{font-size:12px;color:#5E6E85;margin-top:9px;border-top:1px dashed #CDE8DE;
                padding-top:8px;line-height:1.45}
  .empty{padding:26px 20px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.65;
         display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;height:100%;
         min-height:330px}
  .empty .who{color:var(--navy);display:block;font-size:18px;font-weight:800;margin-bottom:4px}
  .empty .hintline{margin-top:2px}
  .steps{display:block;width:fit-content;text-align:left;margin:14px auto 2px;padding-left:20px;
         font-size:12.5px;line-height:1.85;color:#4A5B72;font-weight:600}
  .steps li::marker{color:var(--navy);font-weight:900}
  .legend{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:14px}
  .lg{font-size:9px;font-weight:800;letter-spacing:.4px;border:1.4px solid;border-radius:999px;
      padding:3px 8px;white-space:nowrap;background:#fff;display:inline-flex;align-items:center;gap:4px}
  .lg .gl svg{width:10px;height:10px}

  .controls{display:flex;gap:8px;flex-wrap:wrap}
  .controls>button{flex:1;justify-content:center;padding:12px 14px;font-size:13.5px}
  .hint{font-size:11.5px;color:#63738A;text-align:center;margin-top:-3px}
  .pick{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%}
  .pick button{padding:9px 6px;font-size:11px;border-width:1.8px;justify-content:center;
               background:#fff;letter-spacing:.2px}
  .pick button:last-child:nth-child(odd){grid-column:1 / -1}
  .pick .dot{width:8px;height:8px;border-radius:50%;flex:none}

  /* ------------------------------------------------ scores */
  .scores{display:flex;gap:9px;flex-wrap:wrap;align-items:stretch}
  .chip{position:relative;display:flex;align-items:center;gap:10px;background:#fff;
        border:1.5px solid var(--line);border-radius:14px;padding:9px 14px 9px 11px;
        font-weight:800;color:var(--navy);min-width:150px;overflow:hidden;
        box-shadow:0 8px 20px -18px rgba(16,32,60,.8)}
  .chip .bar{position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
  .chip .face{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;flex:none;
              background:var(--c);color:#fff;font-size:12px;font-weight:900;
              box-shadow:0 4px 10px -6px var(--c)}
  .chip .nm{line-height:1.15;font-size:13.5px}
  .chip small{display:block;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.4px}
  .chip .sc{margin-left:auto;font-size:20px;color:var(--navy);font-weight:900;min-width:16px;text-align:right}
  .chip.turn{border-color:var(--gold);box-shadow:0 0 0 3px #FFF4D6,0 10px 24px -18px rgba(16,32,60,.7)}
  .chip.pop{animation:pop .4s ease-out}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.07)}100%{transform:scale(1)}}
  .addchip{border-style:dashed;color:var(--muted);font-weight:700;min-width:auto;padding:9px 14px;
           background:rgba(255,255,255,.6)}

  /* ------------------------------------------------ modal */
  .modal{position:fixed;inset:0;background:rgba(14,26,48,.5);backdrop-filter:blur(3px);
         display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
  .modal.on{display:flex;animation:fadeIn .18s ease-out}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .sheet{background:#fff;border-radius:20px;max-width:660px;width:100%;max-height:88vh;overflow:auto;
         padding:26px 28px;box-shadow:0 30px 70px -30px rgba(8,18,36,.7);
         animation:sheetIn .22s cubic-bezier(.2,.85,.3,1)}
  @keyframes sheetIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  .sheet h2{margin:0 0 4px;color:var(--navy);font-size:21px;letter-spacing:.1px}
  .sheet p,.sheet li{font-size:13.5px;line-height:1.62}
  .sheet .sub{color:var(--muted);margin:2px 0 16px;font-size:12.5px}
  .sheet li{margin:3px 0}
  .sheet h3{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:20px 0 7px}
  .x{float:right;border:none;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);
     padding:2px 6px;border-radius:8px}
  .x:hover{background:#F1F6FB}
  kbd{background:#EFF5FB;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;
      padding:1px 6px;font:700 11px/1.4 ui-monospace,monospace;color:var(--navy)}
  .final{font-size:15px;margin-top:6px}
  .final .row{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;
              border-bottom:1px solid #EDF3F9}
  .final .row b{color:var(--navy);display:flex;align-items:center;gap:9px}
  .final .medal{width:22px;text-align:center;font-size:15px}
  .final .pts{font-weight:800;color:var(--navy)}

  /* players modal */
  .plist{display:flex;flex-direction:column;gap:8px;margin:4px 0 10px}
  .prow{display:flex;align-items:center;gap:9px}
  .sw{width:30px;height:30px;border-radius:10px;border:none;padding:0;flex:none;cursor:pointer;
      box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 4px 10px -6px rgba(16,32,60,.8)}
  .prow input{flex:1;font:inherit;font-size:14px;font-weight:700;color:var(--navy);
              border:1.5px solid var(--line);border-radius:11px;padding:9px 12px;background:#FBFDFF}
  .prow input:focus{outline:none;border-color:#9FC0DD;background:#fff;box-shadow:0 0 0 3px #EAF3FB}
  .prow .del{width:34px;justify-content:center;padding:8px 0;color:#B02448;border-color:#F1CAD3;font-size:16px}
  .prowadd{margin:2px 0 12px}
  .mrow{display:flex;gap:9px;margin-top:6px}
  .mrow button{flex:1;justify-content:center;padding:11px}
  .tip{font-size:11.5px;color:var(--muted);margin:0 0 6px}
  /* 10-inch tablet in landscape: board + card side by side, no scrolling */
  @media (max-width:1240px){
    main{grid-template-columns:minmax(0,1fr) 336px;gap:11px}
    .wrap{padding:9px 11px 16px;gap:9px}
    header{gap:7px;padding:7px 9px;top:6px}
    .mark{width:36px;height:36px;border-radius:11px}
    h1{font-size:17px}
    h1 small{font-size:9.5px;margin-top:2px}
    button{padding:8px 11px;font-size:12.5px;min-height:40px}
    .board{border-radius:20px;padding:8px}
    .boardnote{font-size:10.5px;margin-top:2px}
    .card{min-height:min(418px,50vh)}
    .controls>button{min-height:50px;font-size:14px}
    .pick button{min-height:50px;font-size:12px}
    .en{font-size:clamp(22px,2.1vw,28px)}
    .artwrap img{max-height:min(190px,22vh)}
  }
  @media (max-width:1000px){
    main{grid-template-columns:1fr}
    .panel{position:static;order:2;top:auto}
    .board{order:1}
    header{position:static}
    .card{min-height:0}
    /* the card becomes a sheet over the board: no scrolling to play */
    .panel.sheet{position:fixed;left:8px;right:8px;bottom:8px;z-index:45;
      max-height:calc(100dvh - 16px);overflow:auto;padding:0 0 8px;gap:7px;
      animation:sheetUp .3s cubic-bezier(.2,.85,.3,1)}
    .panel.sheet .card{box-shadow:0 24px 60px -24px rgba(16,32,60,.55)}
    @keyframes sheetUp{from{transform:translateY(18px);opacity:.4}to{transform:none;opacity:1}}
  }
  @media (max-width:900px){
    #fsBtn .lbl{display:none}
    #fsBtn{padding:8px 10px}
  }
  @media (max-width:560px){
    .wrap{padding:10px 10px 20px}
    .empty{min-height:0;padding:20px 12px}
    .card{min-height:0}
    h1{font-size:17px}
    .scores{gap:7px}
    .chip{min-width:calc(50% - 7px);padding:8px 11px}
    .chip .sc{font-size:18px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect x="3.5" y="3.5" width="17" height="17" rx="4.2" stroke="#EAF2FA" stroke-width="1.8"/>
        <circle cx="8.6" cy="8.6" r="1.5" fill="#EAF2FA"/><circle cx="15.4" cy="8.6" r="1.5" fill="#EAF2FA"/>
        <circle cx="12" cy="12" r="1.5" fill="#E9C46A"/>
        <circle cx="8.6" cy="15.4" r="1.5" fill="#EAF2FA"/><circle cx="15.4" cy="15.4" r="1.5" fill="#EAF2FA"/>
      </svg>
    </div>
    <h1>Grammar Challenge <small>Board game · Lessons 1–9</small></h1>
    <div class="spacer"></div>
    <button id="playersBtn">Players <span class="count" id="pcount">2</span></button>
    <button id="sndBtn" title="Sound on or off" aria-pressed="true">
      <svg id="sndIcon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M3 6h2.2L8.5 3v10L5.2 10H3z" fill="currentColor"/>
        <path id="sndWave" d="M10.6 5.2a4 4 0 0 1 0 5.6M12.4 3.6a6.4 6.4 0 0 1 0 8.8"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>Sound</button>
    <button id="fsBtn" title="Full screen (F)" aria-pressed="false">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 6V3.5A1.5 1.5 0 0 1 3.5 2H6M10 2h2.5A1.5 1.5 0 0 1 14 3.5V6M14 10v2.5a1.5 1.5 0 0 1-1.5 1.5H10M6 14H3.5A1.5 1.5 0 0 1 2 12.5V10"/>
      </svg><span class="lbl">Full screen</span></button>
    <button id="jpBtn" title="Show or hide the Japanese line">日本語</button>
    <button id="rulesBtn">Rules</button>
    <button id="endBtn">End round</button>
    <button id="newBtn">New game</button>
  </header>

  <main>
    <section class="board">
      <svg id="board" viewBox="0 0 1000 690" aria-label="Game board"></svg>
      <p class="boardnote">Roll the die — the light runs clockwise round the seven stacks and stops on one. Answer the card it draws.</p>
    </section>
    <aside class="panel">
      <div class="card" id="card"></div>
      <div id="controls" class="controls"></div>
      <div class="hint" id="hint"></div>
    </aside>
  </main>

  <div class="scores" id="scores"></div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const DATA = {"stacks":{"TENSE":{"name":"TENSE","accent":"#0E6E7E","fill":"#DFF3F6","instr":"Use the verb in the tense on your space."},"NEG":{"name":"NEGATIVE","accent":"#B02448","fill":"#FBD9E0","instr":"Make the sentence negative."},"YN":{"name":"YES / NO QUESTION","accent":"#5B3FB0","fill":"#E2DAFB","instr":"Make a yes/no question."},"WH":{"name":"WH-QUESTION","accent":"#8A6100","fill":"#FDF0C2","instr":"Ask the question shown on the card."},"SUBJ":{"name":"CHANGE THE SUBJECT","accent":"#A9520F","fill":"#FCE0C8","instr":"Change the subject and fix the verb."},"PLUR":{"name":"PLURAL","accent":"#6B3E8E","fill":"#EBDCF7","instr":"Change the sentence to plural."},"ANS":{"name":"ANSWER!","accent":"#0E6E63","fill":"#CFF0EA","instr":"Answer in a complete sentence."}},"cards":[{"id":"T01","stack":"TENSE","en":"I (be) a high school student.","ja":"私は高校生です。","note":"am / is / are for the present, was / were for the past. Do not mix: 'I am was' and 'I were' are the two most common slips.","sub":"","task":"","lesson":"1 / 5","topic":"school","ill":"handup","ans":{"PRESENT":["I am a high school student."],"PAST":["I was a high school student."]}},{"id":"T02","stack":"TENSE","en":"My father (be) a police officer.","ja":"父は警察官です。","note":"he / she / it takes is in the present and was in the past.","sub":"","task":"","lesson":"1 / 5","topic":"family","ill":"family","ans":{"PRESENT":["My father is a police officer."],"PAST":["My father was a police officer."]}},{"id":"T03","stack":"TENSE","en":"We (be) good friends.","ja":"私たちはよい友達です。","note":"we / you / they take are in the present and were in the past.","sub":"","task":"","lesson":"1 / 5","topic":"school","ill":"school","ans":{"PRESENT":["We are good friends."],"PAST":["We were good friends."]}},{"id":"T04","stack":"TENSE","en":"The movie (be) interesting.","ja":"その映画はおもしろいです。","note":"A singular subject (the movie) takes is / was. 'interesting' is an adjective and never changes.","sub":"","task":"","lesson":"1 / 5","topic":"media","ill":"media","ans":{"PRESENT":["The movie is interesting."],"PAST":["The movie was interesting."]}},{"id":"T05","stack":"TENSE","en":"My sister (be) in the kitchen.","ja":"姉は台所にいます。","note":"be verb for place. Singular subject: is / was.","sub":"","task":"","lesson":"1 / 5","topic":"home","ill":"kitchen","ans":{"PRESENT":["My sister is in the kitchen."],"PAST":["My sister was in the kitchen."]}},{"id":"T06","stack":"TENSE","en":"The books (be) on the desk.","ja":"本は机の上にあります。","note":"A plural subject (the books) takes are / were. Watch the -s on the noun.","sub":"","task":"","lesson":"1 / 5","topic":"school","ill":"desk_things","ans":{"PRESENT":["The books are on the desk."],"PAST":["The books were on the desk."]}},{"id":"T07","stack":"TENSE","en":"His birthday (be) April 1st.","ja":"彼の誕生日は4月1日です。","note":"For a date we use is / was. The date does not change.","sub":"","task":"","lesson":"1 / 5","topic":"time","ill":"birthday","ans":{"PRESENT":["His birthday is April 1st."],"PAST":["His birthday was April 1st."]}},{"id":"T08","stack":"TENSE","en":"I (like) music.","ja":"私は音楽が好きです。","note":"I never takes -s. Past of like is liked (regular -d).","sub":"","task":"","lesson":"3 / 6","topic":"music","ill":"music","ans":{"PRESENT":["I like music."],"PAST":["I liked music."]}},{"id":"T09","stack":"TENSE","en":"She (like) sports.","ja":"彼女はスポーツが好きです。","note":"Third person singular adds -s in the present: likes. In the past the -s disappears: liked.","sub":"","task":"","lesson":"3 / 6","topic":"sports","ill":"sports","ans":{"PRESENT":["She likes sports."],"PAST":["She liked sports."]}},{"id":"T10","stack":"TENSE","en":"Tom (play) video games at home.","ja":"トムは家でテレビゲームをします。","note":"Tom = he, so play becomes plays. Past: played (regular, -ed).","sub":"","task":"","lesson":"3 / 6","topic":"hobby","ill":"routine","ans":{"PRESENT":["Tom plays video games at home."],"PAST":["Tom played video games at home."]}},{"id":"T11","stack":"TENSE","en":"My mother (work) at a bookstore.","ja":"母は書店で働いています。","note":"work → works after he / she. Past: worked.","sub":"","task":"","lesson":"3 / 6","topic":"work","ill":"bookstore","ans":{"PRESENT":["My mother works at a bookstore."],"PAST":["My mother worked at a bookstore."]}},{"id":"T12","stack":"TENSE","en":"He (have) a dog.","ja":"彼は犬を飼っています。","note":"Irregular in both tenses: have → has (present), have → had (past).","sub":"","task":"","lesson":"3 / 6","topic":"animal","ill":"walkdog","ans":{"PRESENT":["He has a dog."],"PAST":["He had a dog."]}},{"id":"T13","stack":"TENSE","en":"We (eat) rice and miso soup for breakfast.","ja":"私たちは朝食にご飯とみそ汁を食べます。","note":"Irregular past: eat → ate. We takes the base form in the present.","sub":"","task":"","lesson":"3 / 6","topic":"food","ill":"breakfast","ans":{"PRESENT":["We eat rice and miso soup for breakfast."],"PAST":["We ate rice and miso soup for breakfast."]}},{"id":"T14","stack":"TENSE","en":"Shota (go) to bed at nine.","ja":"翔太は9時に寝ます。","note":"go → goes (verb ending in -o takes -es). Irregular past: go → went.","sub":"","task":"","lesson":"3 / 6","topic":"routine","ill":"wakeup","ans":{"PRESENT":["Shota goes to bed at nine."],"PAST":["Shota went to bed at nine."]}},{"id":"T15","stack":"TENSE","en":"Emi (study) English every night.","ja":"エミは毎晩英語を勉強します。","note":"Consonant + y changes to -ies: study → studies. Past: studied.","sub":"","task":"","lesson":"3 / 6","topic":"school","ill":"desk_things","ans":{"PRESENT":["Emi studies English every night."],"PAST":["Emi studied English every night."]}},{"id":"T16","stack":"TENSE","en":"They (live) in Osaka.","ja":"彼らは大阪に住んでいます。","note":"They takes the base form. Past: lived (regular, -d).","sub":"","task":"","lesson":"3 / 6","topic":"place","ill":"home","ans":{"PRESENT":["They live in Osaka."],"PAST":["They lived in Osaka."]}},{"id":"N01","stack":"NEG","en":"I like music.","ja":"私は音楽が好きではありません。","note":"I / you / we / they use do not. After do, the main verb has no -s.","sub":"do not / don't","task":"Make it negative.","lesson":"3 / 4","topic":"music","ill":"music","ans":{"ANY":["I do not like music.","I don't like music."]}},{"id":"N02","stack":"NEG","en":"She likes sports.","ja":"彼女はスポーツが好きではありません。","note":"does not + base verb. 'She doesn't likes' is wrong: the -s moves to does.","sub":"does not / doesn't","task":"Make it negative.","lesson":"4","topic":"sports","ill":"sports","ans":{"ANY":["She does not like sports.","She doesn't like sports."]}},{"id":"N03","stack":"NEG","en":"He has a dog.","ja":"彼は犬を飼っていません。","note":"After does, has returns to have. 'doesn't has' is a common error.","sub":"does not have","task":"Make it negative.","lesson":"4","topic":"animal","ill":"walkdog","ans":{"ANY":["He does not have a dog.","He doesn't have a dog."]}},{"id":"N04","stack":"NEG","en":"Tom plays video games at home.","ja":"トムは家でテレビゲームをしません。","note":"plays → play after does not.","sub":"does not play","task":"Make it negative.","lesson":"4","topic":"hobby","ill":"routine","ans":{"ANY":["Tom does not play video games at home.","Tom doesn't play video games at home."]}},{"id":"N05","stack":"NEG","en":"My mother works at a bookstore.","ja":"母は書店で働いていません。","note":"works → work after does not.","sub":"does not work","task":"Make it negative.","lesson":"4","topic":"work","ill":"bookstore","ans":{"ANY":["My mother does not work at a bookstore.","My mother doesn't work at a bookstore."]}},{"id":"N06","stack":"NEG","en":"I am a high school student.","ja":"私は高校生ではありません。","note":"The be verb takes not directly. There is no 'amn't'; use I'm not.","sub":"am not / 'm not","task":"Make it negative.","lesson":"2","topic":"school","ill":"handup","ans":{"ANY":["I am not a high school student.","I'm not a high school student."]}},{"id":"N07","stack":"NEG","en":"My mother is a teacher.","ja":"母は先生ではありません。","note":"not comes after is. Do not add do: 'doesn't is' is wrong.","sub":"is not / isn't","task":"Make it negative.","lesson":"2","topic":"family","ill":"family","ans":{"ANY":["My mother is not a teacher.","My mother isn't a teacher."]}},{"id":"N08","stack":"NEG","en":"The books are on the desk.","ja":"本は机の上にありません。","note":"are + not. The plural subject does not change.","sub":"are not / aren't","task":"Make it negative.","lesson":"2","topic":"school","ill":"desk_things","ans":{"ANY":["The books are not on the desk.","The books aren't on the desk."]}},{"id":"N09","stack":"NEG","en":"We were in the same class last year.","ja":"私たちは去年同じクラスではありませんでした。","note":"Past be verb: were + not. Keep the past time word last year.","sub":"were not / weren't","task":"Make it negative.","lesson":"5","topic":"school","ill":"school","ans":{"ANY":["We were not in the same class last year.","We weren't in the same class last year."]}},{"id":"N10","stack":"NEG","en":"The movie was interesting.","ja":"その映画はおもしろくなかったです。","note":"was + not. 'didn't was' is wrong because it is a be verb.","sub":"was not / wasn't","task":"Make it negative.","lesson":"5","topic":"media","ill":"media","ans":{"ANY":["The movie was not interesting.","The movie wasn't interesting."]}},{"id":"N11","stack":"NEG","en":"I watched the TV drama last night.","ja":"私は昨夜テレビドラマを見ませんでした。","note":"did not + base verb. watched → watch after did not.","sub":"did not watch","task":"Make it negative.","lesson":"6","topic":"media","ill":"media","ans":{"ANY":["I did not watch the TV drama last night.","I didn't watch the TV drama last night."]}},{"id":"N12","stack":"NEG","en":"Shota went to bed early last night.","ja":"翔太は昨夜早く寝ませんでした。","note":"Irregular went returns to go after did not.","sub":"did not go","task":"Make it negative.","lesson":"6","topic":"routine","ill":"wakeup","ans":{"ANY":["Shota did not go to bed early last night.","Shota didn't go to bed early last night."]}},{"id":"Y01","stack":"YN","en":"You are on the soccer team.","ja":"あなたはサッカー部ですか。","note":"The be verb moves to the front. you stays you in the question.","sub":"Are ...?","task":"Make a yes/no question.","lesson":"2","topic":"sports","ill":"sports","ans":{"ANY":["Are you on the soccer team?"]},"alt":["Are you on the soccer team? — Yes, I am. / No, I'm not."]},{"id":"Y02","stack":"YN","en":"Lucy is in the brass band.","ja":"ルーシーは吹奏楽部ですか。","note":"is + subject. Answer with she: Yes, she is.","sub":"Is ...?","task":"Make a yes/no question.","lesson":"2","topic":"music","ill":"music","ans":{"ANY":["Is Lucy in the brass band?"]}},{"id":"Y03","stack":"YN","en":"This watch is mine.","ja":"この腕時計はあなたのものですか。","note":"In a question mine becomes yours. Students often keep 'mine'.","sub":"Is ...? / mine → yours","task":"Make a yes/no question.","lesson":"2","topic":"things","ill":"desk_things","ans":{"ANY":["Is this watch yours?"]}},{"id":"Y04","stack":"YN","en":"Your sister plays the piano.","ja":"あなたの姉はピアノを弾きますか。","note":"does + base verb. plays → play after does.","sub":"Does ...?","task":"Make a yes/no question.","lesson":"4","topic":"music","ill":"music","ans":{"ANY":["Does your sister play the piano?"]}},{"id":"Y05","stack":"YN","en":"I play the guitar.","ja":"あなたはギターを弾きますか。","note":"I changes to you in the question. Do + base verb.","sub":"Do ...?","task":"Make a yes/no question.","lesson":"4","topic":"music","ill":"music","ans":{"ANY":["Do you play the guitar?"]}},{"id":"Y06","stack":"YN","en":"Your brother likes music.","ja":"あなたの兄は音楽が好きですか。","note":"likes → like after does. your stays your in the question.","sub":"Does ...?","task":"Make a yes/no question.","lesson":"4","topic":"music","ill":"walkdog","ans":{"ANY":["Does your brother like music?"]}},{"id":"Y07","stack":"YN","en":"My parents watch the news every night.","ja":"ご両親は毎晩ニュースを見ますか。","note":"my → your in the question. Parents = they, so use do (no -s).","sub":"Do ...?","task":"Make a yes/no question.","lesson":"4","topic":"home","ill":"media","ans":{"ANY":["Do your parents watch the news every night?"]}},{"id":"Y08","stack":"YN","en":"Ken watched the soccer game last night.","ja":"ケンは昨夜サッカーの試合を見ましたか。","note":"did + base verb. watched → watch after did.","sub":"Did ...?","task":"Make a yes/no question.","lesson":"6","topic":"sports","ill":"media","ans":{"ANY":["Did Ken watch the soccer game last night?"]}},{"id":"Y09","stack":"YN","en":"We visited our grandmother a week ago.","ja":"あなたたちは一週間前に祖母を訪ねましたか。","note":"our → your. did + base verb: visited → visit.","sub":"Did ...?","task":"Make a yes/no question.","lesson":"6","topic":"family","ill":"family","ans":{"ANY":["Did you visit your grandmother a week ago?"]}},{"id":"Y10","stack":"YN","en":"You were late for school last week.","ja":"あなたは先週学校に遅刻しましたか。","note":"were + subject. Word order: Were you ...? not 'Did you were ...?'","sub":"Were ...?","task":"Make a yes/no question.","lesson":"5","topic":"school","ill":"school","ans":{"ANY":["Were you late for school last week?"]}},{"id":"Y11","stack":"YN","en":"There is a microwave oven in my house.","ja":"あなたの家に電子レンジはありますか。","note":"Is + there + noun. my → your in the question.","sub":"Is there ...?","task":"Make a yes/no question.","lesson":"9","topic":"home","ill":"kitchen","ans":{"ANY":["Is there a microwave oven in your house?"]}},{"id":"Y12","stack":"YN","en":"There are some pictures on the wall.","ja":"壁に何枚か絵がありますか。","note":"some changes to any in a question: Are there any ...?","sub":"Are there any ...?","task":"Make a yes/no question.","lesson":"9","topic":"school","ill":"desk_things","ans":{"ANY":["Are there any pictures on the wall?"]}},{"id":"W01","stack":"WH","en":"They live in Tokyo.","ja":"彼らはどこに住んでいますか。","note":"where + do + subject + base verb. The answer is the place: in Tokyo.","sub":"WHERE","task":"Ask about the place.","lesson":"7","topic":"place","ill":"park","ans":{"ANY":["Where do they live?"]}},{"id":"W02","stack":"WH","en":"Ms. Kim is a tour conductor.","ja":"キムさんの仕事は何ですか。","note":"Two natural patterns: What is ... job? and What does ... do?","sub":"WHAT","task":"Ask about her job.","lesson":"7","topic":"work","ill":"bookstore","ans":{"ANY":["What is Ms. Kim's job?","What does Ms. Kim do?"]}},{"id":"W03","stack":"WH","en":"His birthday is April 1st.","ja":"彼の誕生日はいつですか。","note":"when + be verb + subject. Answer with it is: It is April 1st.","sub":"WHEN","task":"Ask about the date.","lesson":"7","topic":"time","ill":"birthday","ans":{"ANY":["When is his birthday?"]}},{"id":"W04","stack":"WH","en":"She comes from England.","ja":"彼女はどこ出身ですか。","note":"Where ... from? The preposition from stays at the end.","sub":"WHERE","task":"Ask about her country.","lesson":"7","topic":"place","ill":"talking","ans":{"ANY":["Where does she come from?"]}},{"id":"W05","stack":"WH","en":"Emily is sixteen.","ja":"エミリーは何歳ですか。","note":"how + adjective comes first: How old is ...? not 'How is old ...?'","sub":"HOW OLD","task":"Ask about her age.","lesson":"8","topic":"people","ill":"talking","ans":{"ANY":["How old is Emily?"]}},{"id":"W06","stack":"WH","en":"My sister is 160 centimeters tall.","ja":"あなたの姉は身長がどのくらいですか。","note":"my → your in the question. how tall is + subject.","sub":"HOW TALL","task":"Ask about her height.","lesson":"8","topic":"people","ill":"talking","ans":{"ANY":["How tall is your sister?"]}},{"id":"W07","stack":"WH","en":"I eat out twice a month.","ja":"あなたはどのくらいの頻度で外食しますか。","note":"how often asks about frequency: twice a month, once a week, every day.","sub":"HOW OFTEN","task":"Ask about the frequency.","lesson":"8","topic":"food","ill":"eatingout","ans":{"ANY":["How often do you eat out?"]}},{"id":"W08","stack":"WH","en":"There are forty students in our class.","ja":"あなたのクラスに生徒は何人いますか。","note":"how many + plural noun + are there. our → your.","sub":"HOW MANY","task":"Ask about the number.","lesson":"8","topic":"school","ill":"handup","ans":{"ANY":["How many students are there in your class?"]}},{"id":"W09","stack":"WH","en":"Shota broke the vase.","ja":"だれが花びんを割ったのですか。","note":"who is the subject, so there is no do: Who broke ...? not 'Who did break ...?'","sub":"WHO","task":"Ask about the person.","lesson":"8","topic":"home","ill":"park","ans":{"ANY":["Who broke the vase?"]}},{"id":"W10","stack":"WH","en":"My mother was angry for an hour.","ja":"あなたのお母さんはどのくらい怒っていましたか。","note":"how long asks about a period of time. Answer with for: For an hour.","sub":"HOW LONG","task":"Ask about the length of time.","lesson":"8","topic":"family","ill":"family","ans":{"ANY":["How long was your mother angry?"]}},{"id":"W11","stack":"WH","en":"Tom plays the guitar after school.","ja":"トムは放課後どこでギターを弾きますか。","note":"where + does + subject + base verb. plays → play after does.","sub":"WHERE","task":"Ask about the place.","lesson":"7","topic":"hobby","ill":"music","ans":{"ANY":["Where does Tom play the guitar after school?"]},"alt":["Where does Tom play the guitar?"]},{"id":"W12","stack":"WH","en":"Emi watched the TV drama last night.","ja":"エミは昨夜何を見ましたか。","note":"what + did + subject + base verb. watched → watch after did.","sub":"WHAT","task":"Ask about the thing.","lesson":"7","topic":"media","ill":"media","ans":{"ANY":["What did Emi watch last night?"]}},{"id":"S01","stack":"SUBJ","en":"I play tennis.","ja":"彼はテニスをします。","note":"he / she / it add -s to the verb: play → plays.","sub":"I → he","task":"Change the subject to he.","lesson":"3","topic":"sports","ill":"sports","ans":{"ANY":["He plays tennis."]}},{"id":"S02","stack":"SUBJ","en":"I like soccer.","ja":"彼女はサッカーが好きです。","note":"like → likes after she.","sub":"I → she","task":"Change the subject to she.","lesson":"3","topic":"sports","ill":"sports","ans":{"ANY":["She likes soccer."]}},{"id":"S03","stack":"SUBJ","en":"My father is a police officer.","ja":"両親は警察官です。","note":"Two changes are needed: is → are and 'a police officer' → 'police officers'.","sub":"my father → my parents","task":"Change the subject to my parents.","lesson":"1","topic":"family","ill":"family","ans":{"ANY":["My parents are police officers."]}},{"id":"S04","stack":"SUBJ","en":"My sister is in the kitchen.","ja":"兄たちは台所にいます。","note":"Singular is → plural are.","sub":"my sister → my brothers","task":"Change the subject to my brothers.","lesson":"1","topic":"home","ill":"kitchen","ans":{"ANY":["My brothers are in the kitchen."]}},{"id":"S05","stack":"SUBJ","en":"I get up at six thirty.","ja":"彼は6時30分に起きます。","note":"get → gets. The time does not change.","sub":"I → he","task":"Change the subject to he.","lesson":"3","topic":"routine","ill":"wakeup","ans":{"ANY":["He gets up at six thirty."]}},{"id":"S06","stack":"SUBJ","en":"They live in Osaka.","ja":"彼女は大阪に住んでいます。","note":"live → lives after she.","sub":"they → she","task":"Change the subject to she.","lesson":"4","topic":"place","ill":"park","ans":{"ANY":["She lives in Osaka."]}},{"id":"S07","stack":"SUBJ","en":"I visited my grandmother last week.","ja":"彼女は先週祖母を訪ねました。","note":"The past form does not change with the subject: visited stays visited.","sub":"I → she","task":"Change the subject to she.","lesson":"6","topic":"family","ill":"family","ans":{"ANY":["She visited my grandmother last week."]}},{"id":"S08","stack":"SUBJ","en":"I am a member of the tennis team.","ja":"私たちはテニス部の部員です。","note":"am → are, and 'a member' → 'members'.","sub":"I → we","task":"Change the subject to we.","lesson":"1","topic":"school","ill":"school","ans":{"ANY":["We are members of the tennis team."]}},{"id":"S09","stack":"SUBJ","en":"My brother works at a bank.","ja":"兄たちは銀行で働いています。","note":"A plural subject drops the -s: works → work.","sub":"my brother → my brothers","task":"Change the subject to my brothers.","lesson":"3","topic":"work","ill":"bookstore","ans":{"ANY":["My brothers work at a bank."]}},{"id":"S10","stack":"SUBJ","en":"I was busy yesterday.","ja":"彼らは昨日忙しかったです。","note":"was → were with they. The past time word stays.","sub":"I → they","task":"Change the subject to they.","lesson":"5","topic":"routine","ill":"routine","ans":{"ANY":["They were busy yesterday."]}},{"id":"P01","stack":"PLUR","en":"This is a book.","ja":"これらは本です。","note":"Three changes: this → these, is → are, 'a book' → 'books'.","sub":"this → these, is → are","task":"Change to plural.","lesson":"1","topic":"school","ill":"desk_things","ans":{"ANY":["These are books."]}},{"id":"P02","stack":"PLUR","en":"That is my pen.","ja":"あれらは私のペンです。","note":"that → those. my does not change: my pens.","sub":"that → those, is → are","task":"Change to plural.","lesson":"1","topic":"things","ill":"desk_things","ans":{"ANY":["Those are my pens."]}},{"id":"P03","stack":"PLUR","en":"He is a high school student.","ja":"彼らは高校生です。","note":"he → they, is → are, and the noun takes -s.","sub":"he → they, is → are","task":"Change to plural.","lesson":"1","topic":"school","ill":"handup","ans":{"ANY":["They are high school students."]}},{"id":"P04","stack":"PLUR","en":"The dog is under the table.","ja":"犬がテーブルの下にいます。","note":"Only the noun and the be verb change: is → are.","sub":"dog → dogs, is → are","task":"Change to plural.","lesson":"1","topic":"animal","ill":"animal","ans":{"ANY":["The dogs are under the table."]}},{"id":"P05","stack":"PLUR","en":"This is a dictionary.","ja":"これらは辞書です。","note":"Consonant + y changes to -ies: dictionary → dictionaries.","sub":"this → these, is → are","task":"Change to plural.","lesson":"1","topic":"school","ill":"desk_things","ans":{"ANY":["These are dictionaries."]}},{"id":"P06","stack":"PLUR","en":"There is a textbook on the desk.","ja":"机の上に教科書が何冊かあります。","note":"There is → There are, 'a textbook' → 'some textbooks'. Use some, not a.","sub":"There is → There are","task":"Change to plural.","lesson":"9","topic":"school","ill":"school","ans":{"ANY":["There are some textbooks on the desk."]}},{"id":"P07","stack":"PLUR","en":"She is a good cook.","ja":"彼女たちは料理が上手です。","note":"she → they, is → are, and the countable noun takes -s: cooks.","sub":"she → they","task":"Change to plural.","lesson":"1","topic":"food","ill":"kitchen","ans":{"ANY":["They are good cooks."]}},{"id":"P08","stack":"PLUR","en":"The book is on the desk.","ja":"本は机の上にあります。","note":"The noun takes -s and is → are. 'the' does not change.","sub":"book → books","task":"Change to plural.","lesson":"1","topic":"school","ill":"desk_things","ans":{"ANY":["The books are on the desk."]}},{"id":"A01","stack":"ANS","en":"Where do you live?","ja":"あなたはどこに住んでいますか。","note":"Answer with the subject and verb: I live in ... . One word ('Tokyo') is not enough.","sub":"","task":"Answer in a complete sentence.","lesson":"7","topic":"place","ill":"park","ans":{"ANY":["I live in Tokyo."]},"alt":["I live in Osaka.","I live in Saitama."]},{"id":"A02","stack":"ANS","en":"What time do you get up?","ja":"あなたは何時に起きますか。","note":"at + time. The answer needs the full phrase: I get up at ... .","sub":"","task":"Answer in a complete sentence.","lesson":"8","topic":"routine","ill":"wakeup","ans":{"ANY":["I get up at six thirty."]},"alt":["I get up at seven.","I get up at six."]},{"id":"A03","stack":"ANS","en":"How many students are there in your class?","ja":"あなたのクラスに生徒は何人いますか。","note":"Answer with There are + number + plural noun.","sub":"","task":"Answer in a complete sentence.","lesson":"8 / 9","topic":"school","ill":"handup","ans":{"ANY":["There are forty students in my class."]},"alt":["There are forty students.","There are thirty-five students in my class."]},{"id":"A04","stack":"ANS","en":"Do you have a dog?","ja":"あなたは犬を飼っていますか。","note":"A full-sentence answer repeats the verb: I have / I don't have.","sub":"","task":"Answer in a complete sentence.","lesson":"4","topic":"animal","ill":"animal","ans":{"ANY":["Yes, I have a dog.","No, I don't have a dog."]},"alt":["Yes, I do. I have a dog.","No, I don't. I have a cat."]},{"id":"A05","stack":"ANS","en":"Were you busy yesterday?","ja":"あなたは昨日忙しかったですか。","note":"A be-verb question is answered with the be verb: I was / I wasn't.","sub":"","task":"Answer in a complete sentence.","lesson":"5","topic":"routine","ill":"routine","ans":{"ANY":["Yes, I was busy yesterday.","No, I wasn't busy yesterday."]}},{"id":"A06","stack":"ANS","en":"Who broke the vase?","ja":"だれが花びんを割ったのですか。","note":"The subject comes first, then the past verb. Do not answer with 'Shota did' alone if the task asks for a full sentence.","sub":"","task":"Answer in a complete sentence.","lesson":"8","topic":"home","ill":"home","ans":{"ANY":["Shota broke the vase."]},"alt":["Emi broke the vase."]},{"id":"A07","stack":"ANS","en":"Where does your mother work?","ja":"あなたのお母さんはどこで働いていますか。","note":"she + works (the -s stays in the answer).","sub":"","task":"Answer in a complete sentence.","lesson":"7","topic":"work","ill":"bookstore","ans":{"ANY":["She works at a bookstore."]},"alt":["My mother works at a bookstore.","She works at a bank."]},{"id":"A08","stack":"ANS","en":"Is there a microwave oven in your house?","ja":"あなたの家に電子レンジはありますか。","note":"A there is question is answered with there is: Yes, there is ... .","sub":"","task":"Answer in a complete sentence.","lesson":"9","topic":"home","ill":"kitchen","ans":{"ANY":["Yes, there is a microwave oven in my house.","No, there isn't a microwave oven in my house."]}}],"spaces":[{"n":1,"k":"START"},{"n":2,"k":"NE"},{"n":3,"k":"PA"},{"n":4,"k":"YN"},{"n":5,"k":"WH"},{"n":6,"k":"PL"},{"n":7,"k":"PR"},{"n":8,"k":"AN"},{"n":9,"k":"CS"},{"n":10,"k":"NE"},{"n":11,"k":"PA"},{"n":12,"k":"WH"},{"n":13,"k":"YN"},{"n":14,"k":"PR"},{"n":15,"k":"PL"},{"n":16,"k":"NE"},{"n":17,"k":"WH"},{"n":18,"k":"CS"},{"n":19,"k":"PA"},{"n":20,"k":"YN"},{"n":21,"k":"PR"},{"n":22,"k":"AN"},{"n":23,"k":"NE"},{"n":24,"k":"WH"},{"n":25,"k":"PA"},{"n":26,"k":"YN"},{"n":27,"k":"CS"},{"n":28,"k":"PR"}],"images":{"animal":"data:image/webp;base64,UklGRsYZAABXRUJQVlA4WAoAAAAQAAAA5QAA5QAAQUxQSMADAAABL0CQbeMPOJvt14iI+I+Hh9q2Vdu2bStlBzlJWMsBOQD/omptVFttCzZG9H8C/OmP37/2V8P3+sOP3+tf4/yj9B8F80V/lfNF/yzni/4VO1/0yfmiT85fpH/5zBf9Z8Z8DtN+RKqGYzXdHYDhrAG2xoOnupc80ROh94R3hEd7BNwS6BvC07MAvSEAb+DxnqC7yHMcFLgG5AVhxYNCrwBCl2PJqqCBT+q5QN/AopMqYDhsoO6rB+Fq/QAv5RVZLlfcGQcAxTEF6O40QOthAbq7AK0nB3YHeDFAs7XxigNP5H25w8AjN68F9cb9eWd211vcnffmi9xWn8h6LtWb7K401LsDq2UhbnNTHTrrmb7FZcAp9Ag46GfkDHvKAUBnHGW9rFANfcD1XMGBE /* ---------------------------------------------------------------- helpers */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function el(tag, attrs, parent){
  const n=document.createElementNS(NS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}
function text(x,y,str,attrs,parent){
  const n=el("text",Object.assign({x,y,"text-anchor":"middle","font-family":"inherit"},attrs),parent);
  n.textContent=str; return n;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* --------------------------------------------------------------- sound */
let AC=null, soundOn=true;
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC && AC.state==="suspended"){ try{ AC.resume(); }catch(e){} }
  return AC;
}
function tone(f,dur,type,gain,when,slideTo){
  const a=ac(); if(!a||!soundOn) return;
  const t0=a.currentTime+(when||0);
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(gain,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0+dur+0.03);
}
function noise(dur,gain,when,band){
  const a=ac(); if(!a||!soundOn) return;
  const t0=a.currentTime+(when||0), n=Math.max(1,Math.floor(a.sampleRate*dur));
  const buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.6);
  const src=a.createBufferSource(); src.buffer=buf;
  const f=a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=band||1600; f.Q.value=.8;
  const g=a.createGain(); g.gain.value=gain;
  src.connect(f).connect(g).connect(a.destination); src.start(t0);
}
const SFX={
  roll(){ noise(.34,.035,0,900); [0,.06,.12,.17,.22,.27,.32,.37].forEach((t,i)=>noise(.04,.045,t,2600-i*140)); },
  step(k){ tone(500+(k||1)*34,.045,"triangle",.02); },
  land(){ tone(190,.16,"sine",.07,0,120); noise(.1,.04,0,700); },
  card(){ noise(.16,.04,0,2400); tone(620,.1,"sine",.025,.02,880); },
  reveal(){ tone(880,.1,"sine",.035); tone(1320,.14,"sine",.03,.07); },
  good(){ tone(660,.09,"triangle",.05); tone(990,.14,"triangle",.045,.08); },
  bonus(){ tone(660,.09,"triangle",.05); tone(880,.09,"triangle",.045,.08); tone(1320,.18,"triangle",.045,.16); },
  bad(){ tone(300,.16,"sine",.05,0,190); },
  end(){ [523,659,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.04,i*.1)); }
};
function sfx(name,arg){ try{ if(soundOn && SFX[name]) SFX[name](arg); }catch(e){} }

let toastEl=null, toastT=null;
function toast(msg){
  if(!toastEl){ toastEl=document.createElement("div"); toastEl.className="toast";
                document.body.appendChild(toastEl); }
  toastEl.textContent=msg; toastEl.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove("on"),2800);
}
const fsBtn=$("#fsBtn");
function fsPaint(){
  const on=!!document.fullscreenElement;
  if(fsBtn){ fsBtn.classList.toggle("on",on); fsBtn.setAttribute("aria-pressed",on?"true":"false"); }
}
if(fsBtn){
  if(!document.fullscreenEnabled){ fsBtn.style.display="none"; }
  fsBtn.onclick=async()=>{

      if(document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
      fsPaint();
    }catch(e){ toast("Full screen is blocked here — open the file in a browser tab (F11)."); }
  };
  document.addEventListener("fullscreenchange",fsPaint);
}

/* ------------------------------------------------------- ring geometry */
function ringPoint(t, cx, cy, a, b, r){
  const sw=2*(a-r), sb=2*(b-r), arc=Math.PI*r/2;
  const P=2*sw+2*sb+4*arc;
  let d=t*P, x, y;
  if(d<=sw){ x=cx-a+r+d; y=cy+b; return {x,y}; } d-=sw;
  if(d<=arc){ const th=Math.PI/2-d/r; x=cx+a-r+r*Math.cos(th); y=cy+b-r+r*Math.sin(th); return {x,y}; } d-=arc;
  if(d<=sb){ x=cx+a; y=cy+b-r-d; return {x,y}; } d-=sb;
  if(d<=arc){ const th=-d/r; x=cx+a-r+r*Math.cos(th); y=cy-b+r+r*Math.sin(th); return {x,y}; } d-=arc;
  if(d<=sw){ x=cx+a-r-d; y=cy-b; return {x,y}; } d-=sw;
  if(d<=arc){ const th=-Math.PI/2-d/r; x=cx-a+r+r*Math.cos(th); y=cy-b+r+r*Math.sin(th); return {x,y}; } d-=arc;
  if(d<=sb){ x=cx-a; y=cy-b+r+d; return {x,y}; } d-=sb;
  const th=Math.PI-d/r; x=cx-a+r+r*Math.cos(th); y=cy+b-r+r*Math.sin(th);
  return {x,y};
}

function renderChips(){
  const g=$("#chips"); if(!g) return; g.innerHTML="";
  const n=state.players.length;
  const r=n<=2?13:n<=4?11:9.4, fs=(r*0.92).toFixed(1);
  const lay={
    1:[[0]],
    2:[[-18,18]],
    3:[[-30,0,30]],
    4:[[-33,-11,11,33]],
    5:[[-36,-12,12,36],[0]],
    6:[[-36,-12,12,36],[0]]
  }[n]||[[0]];
  state.players.forEach((p,i)=>{
    const rowIdx = (n===5||n===6) ? (i<4?0:1) : 0;
    const x = (lay[rowIdx]||[0])[ (n===5||n===6) ? (i<4?i:0) : i ] || 0;
    const y = rowIdx===0 ? (n===5||n===6?-8:-2) : 34;
    const wrap=el("g",{transform:`translate(${x},${44+y})`},g);
    if(i===state.turn&&state.phase!=="over"){
      el("circle",{r:r+4,fill:p.color,opacity:.3,class:"halo"},wrap);
    }
    el("circle",{r:r,fill:p.color,stroke:"#fff","stroke-width":2.2,filter:"url(#soft)"},wrap);
    text(0,+fs*0.35,(i+1)+"",{fill:"#fff","font-size":fs,"font-weight":900},wrap);
  });
}

function pillFor(card, space){
  const k=space?space.k:"PR";
  if(card.stack==="TENSE") return k==="START" ? "SAY IT IN THE PRESENT OR THE PAST"
                                  : k==="PA" ? "SAY IT IN THE PAST" : "SAY IT IN THE PRESENT";
  if(card.stack==="NEG") return "MAKE IT NEGATIVE";
  if(card.stack==="YN") return "MAKE A YES / NO QUESTION";
  if(card.stack==="WH") return "WH-WORD: "+(card.sub||"").toUpperCase();
  if(card.stack==="SUBJ") return "NEW SUBJECT: "+(card.sub||"").replace("→","›").toUpperCase();
  if(card.stack==="PLUR") return "CHANGE TO PLURAL";
  return "ANSWER IN A FULL SENTENCE";
}
function answersFor(card, space){
  if(card.stack!=="TENSE") return [{label:"", items:card.ans.ANY||[]}];
  const k=space?space.k:"PR";
  if(k==="PA")  return [{label:"PAST",    items:card.ans.PAST||[]}];
  if(k==="PR")  return [{label:"PRESENT", items:card.ans.PRESENT||[]}];
  return [{label:"PRESENT", items:card.ans.PRESENT||[]},
          {label:"PAST",    items:card.ans.PAST||[]}];
}

  const panel=document.querySelector(".panel"); if(!panel) return;
  panel.classList.toggle("sheet", window.innerWidth<=1000 && state.phase!=="idle");
}

function renderCard(){
  const box=$("#card");
  if(!state.card){
    box.style.setProperty("--acc","#16233D");
    box.style.borderColor="#E1ECF7";
    const p=state.players[state.turn];
    const legend=Object.keys(STACKS).map(k=>
      `<span class="lg" style="border-color:${STACKS[k].accent};color:${STACKS[k].accent}">
          <span class="gl">${GLYPH[k]||""}</span>${STACKS[k].name}</span>`).join("");
    box.innerHTML=`<div class="empty">
        <span class="who">${p?esc(p.name)+" to play":"Ready"}</span>
        <ol class="steps">
          <li>Roll the dice</li><li>Move your token</li><li>Draw from the matching stack</li>
          <li>Complete the task</li><li>Check your answer</li>
        </ol>
        <div class="legend">${legend}</div>
      </div>`;
    return;
  }
  const c=state.card, sp=state.space, st=STACKS[c.stack];
  box.style.borderColor=st.accent;
  box.style.setProperty("--acc",st.accent);
  box.style.setProperty("--glow",st.accent+"66");
  const pill=pillFor(c,sp);
  const shows=state.phase==="revealed";
  const ans=answersFor(c,sp);
  const foot=[c.lesson?("Lesson "+c.lesson):"", c.topic?c.topic:""].filter(Boolean).join(" · ");
  box.innerHTML=`
    <div class="band"><span class="bl"><span class="gl">${GLYPH[c.stack]||""}</span>${st.name}</span>
      <span class="id">${c.id}</span></div>
    <div class="body">
      <div class="pill" style="border-color:${st.accent};color:${st.accent}">${pill}</div>
      <div class="en">${c.en}</div>
      <div class="ja ${state.jp?"":"hide"}">${c.ja}</div>
      <div class="artwrap"><img alt="" src="${IMG[c.ill]||""}"></div>
    </div>
    <div class="foot"><span>${foot||"Grammar Challenge"}</span><span>${c.stack}</span></div>`;
  if(shows){
    const flat=ans.reduce((o,g)=>o.concat(g.items),[]);
    const alt=(c.alt||[]).filter(a=>!flat.includes(a));
    const groups=ans.map(g=>
      (g.label?`<div class="alab">${g.label}</div>`:"")+
      g.items.map(a=>`<div class="a">${a}</div>`).join("")).join("");
    box.insertAdjacentHTML("beforeend",`
      <div class="answerwrap">
        <div class="answer">
          <h4>Model answer</h4>
          ${groups}
          ${alt.length?`<div class="alt">Also accepted: ${alt.join(" · ")}</div>`:""}
          ${c.note?`<div class="note">${c.note}</div>`:""}
        </div>
      </div>`);
  }
}

function renderControls(){
  const c=$("#controls"), hint=$("#hint");
  c.innerHTML="";
  const p=state.players[state.turn];
  if(state.phase==="over"){
    c.innerHTML=`<button class="primary" id="again">Play again</button>`;
    $("#again").onclick=()=>newGame();
    hint.textContent="";
    return;
  }
  if(state.phase==="idle"){
    c.innerHTML=`<button class="primary" id="roll" ${state.rolling?"disabled":""}>Roll the dice</button>`;
    $("#roll").onclick=roll;
    hint.innerHTML=`<kbd>Space</kbd> to roll · ${p?esc(p.name):""} to play`;
  }else if(state.phase==="question"){
    c.innerHTML=`<button class="primary" id="show">Show the answer</button>`;
    $("#show").onclick=reveal;
    hint.innerHTML=`Say it out loud first. <kbd>Space</kbd> to reveal.`;
  }else if(state.phase==="revealed"){
    c.innerHTML=`<button class="good" id="ok">Correct +1</button>
                 <button class="bonus" id="ok2">Full sentence +2</button>
                 <button class="bad" id="no">Try again</button>`;
    $("#ok").onclick=()=>judge(1);
    $("#ok2").onclick=()=>judge(2);
    $("#no").onclick=()=>judge(0);
    hint.innerHTML=`<kbd>1</kbd> correct · <kbd>2</kbd> full sentence · <kbd>3</kbd> try again`;
  }
}

/* --------------------------------------------------------------- game */
function newGame(){
  state.players=roster.map(r=>({name:r.name, color:r.color, score:0, good:0}));
  state.turn=0; state.phase="idle"; state.card=null; state.space=null;
  state.turns=0; state.rolling=false; lastScore=[];
  state.lastK=null; state.curK=null;
  state.decks={};
  for(const k in STACKS) state.decks[k]=shuffle(CARDS.filter(c=>c.stack===k).map(c=>c.id));
  $("#pcount").textContent=state.players.length;
  render();
}
function draw(stack){
  let d=state.decks[stack];
  if(!d||!d.length) d=state.decks[stack]=shuffle(CARDS.filter(c=>c.stack===stack).map(c=>c.id));
  const id=d.pop();
  return CARDS.find(c=>c.id===id);
}
function roll(){
  if(state.phase!=="idle"||state.rolling) return;
  state.rolling=true; renderControls();
  const die=$("#dieInner"); if(die) die.classList.add("throw");
  sfx("roll");
  const steps=1+Math.floor(Math.random()*6);
  state.hopTotal=steps;
  let ticks=0;
  const spin=setInterval(()=>{ drawPips(1+Math.floor(Math.random()*6)); if(++ticks>10) clearInterval(spin); },58);
  setTimeout(()=>{
    clearInterval(spin); drawPips(steps);
    if(die) die.classList.remove("throw");
    chase(steps);
  },640);
}
/* the die value walks the seven toolbox cells clockwise */
function flashCell(k){
  const g=document.querySelector('.cell[data-k="'+k+'"]'); if(!g) return;
  g.classList.remove("chase"); void g.getBoundingClientRect(); g.classList.add("chase");
  setTimeout(()=>g.classList.remove("chase"),360);
}
function lightCell(k){
  document.querySelectorAll(".cell.last").forEach(c=>c.classList.remove("last"));
  const g=document.querySelector('.cell[data-k="'+k+'"]'); if(!g) return;
  g.classList.remove("lit"); void g.getBoundingClientRect();
  g.classList.add("lit","last");
}
let spotTimer=null;
function spotlightCell(){
  const board=$("#board"); if(!board) return;
  board.classList.add("focus");
  clearTimeout(spotTimer);
  spotTimer=setTimeout(()=>{
    board.classList.remove("focus");
    document.querySelectorAll(".cell.lit").forEach(c=>c.classList.remove("lit"));
  },1700);
}
function chase(steps){
  let i=RING.indexOf(state.lastK);
  let done=0;
  const tick=()=>{
    i=(i+1)%7; done++;
    state.curK=RING[i];
    flashCell(RING[i]);
    sfx("step",6-done+1);
    if(done>=steps){ setTimeout(landCell,160); return; }
    setTimeout(tick,52+(steps-done)*13);
  };
  setTimeout(tick,90);
}
function landCell(){
  const k=state.curK||RING[0];
  state.lastK=k; state.rolling=false;
  state.space = k==="TENSE"
    ? {k:(Math.random()<0.5?"PR":"PA"), n:0}
    : {k:KIND_OF[k], n:0};
  lightCell(k); spotlightCell(); sfx("land");
  drawFrom(k);
}
function drawFrom(stack){
  state.card=draw(stack);
  state.phase="question";
  render();
  sfx("card");
  flyCard();
}
/* FLIP: the card grows out of the space the token is standing on */
function flyCard(){
  const box=$("#card"); if(!box) return;
  const slot=state.curK?document.querySelector('.cell[data-k="'+state.curK+'"]'):null;
  box.classList.remove("enter","fly");
  void box.offsetWidth;
  const calm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!slot||calm){ box.classList.add("enter"); return; }
  const a=slot.getBoundingClientRect(), b=box.getBoundingClientRect();
  if(!a.width||!b.width){ box.classList.add("enter"); return; }
  const dx=(a.left+a.width/2)-(b.left+b.width/2);
  const dy=(a.top+a.height/2)-(b.top+b.height/2);
  const fs=Math.max(.18,Math.min(.8,a.width/b.width*1.2));
  box.style.setProperty("--fx",dx.toFixed(1)+"px");
  box.style.setProperty("--fy",dy.toFixed(1)+"px");
  box.style.setProperty("--fs",fs.toFixed(3));
  box.classList.add("fly");
  setTimeout(()=>box.classList.remove("fly"),540);
}
function reveal(){ if(state.phase!=="question") return; state.phase="revealed"; render(); sfx("reveal"); }
function judge(pts){
  if(state.phase!=="revealed") return;
  const p=state.players[state.turn];
  sfx(pts===2 ? "bonus" : pts===1 ? "good" : "bad");
  p.score+=pts; if(pts>0) p.good++;
  if(pts===0 && state.card) state.decks[state.card.stack].unshift(state.card.id);
  state.card=null; state.space=null; state.phase="idle"; state.turns++;
  state.turn=(state.turn+1)%state.players.length;
  render();
}
function endGame(){
  if(state.phase==="over") return;
  state.phase="over";
  sfx("end");
  const order=state.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score);
  const rows=order.map((o,rank)=>{
    const medal=["①","②","③"][rank]||"·";
    return `<div class="row"><b><span class="medal">${medal}</span>
      <span style="color:${o.p.color}">●</span> ${esc(o.p.name)}</b>
      <span class="pts">${o.p.score} point${o.p.score===1?"":"s"}</span></div>`;
  }).join("");
  openModal(`<button class="x" onclick="closeModal()">×</button>
    <h2>Round over</h2>
    <p class="sub">No winner is declared — the loop has no last square. Ask each group what they got right and why.</p>
    <div class="final">${rows}</div>
    <div class="mrow"><button class="primary" onclick="closeModal();newGame()">Play again</button>
      <button onclick="closeModal()">Keep playing</button></div>`);
  render();
}

/* -------------------------------------------------------------- modals */
function openModal(html){ $("#sheet").innerHTML=html; $("#modal").classList.add("on"); }
function closeModal(){
  $("#modal").classList.remove("on");
  if(state.phase==="over"){ state.phase="idle"; render(); }
}

function openPlayers(){
  let draft=roster.map(p=>({name:p.name,color:p.color}));
  const used=()=>new Set(draft.map(d=>d.color));
  const free=()=>COLORS.find(c=>!used().has(c))||COLORS[draft.length%COLORS.length];

  function paint(){
    const rows=draft.map((p,i)=>`
      <div class="prow">
        <button class="sw" data-sw="${i}" style="background:${p.color}" title="Change colour"
          aria-label="Change colour"></button>
        <input data-nm="${i}" value="${esc(p.name)}" maxlength="16" placeholder="Player ${i+1}"
          aria-label="Player ${i+1} name">
        <button class="del" data-del="${i}" ${draft.length<=1?"disabled":""} title="Remove">×</button>
      </div>`).join("");
    openModal(`
      <button class="x" onclick="closeModal()">×</button>
      <h2>Players</h2>
      <p class="sub">Up to six. Names and colours are kept for the next round.</p>
      <div class="plist">${rows}</div>
      <div class="prowadd"><button id="addP" ${draft.length>=MAXP?"disabled":""}>+ Add player</button></div>
      <p class="tip">Changing the number of players starts a new round.</p>
      <div class="mrow"><button class="primary" id="applyP">Apply</button>
        <button id="cancelP">Cancel</button></div>`);

    const sheet=$("#sheet");
    sheet.querySelectorAll("[data-nm]").forEach(inp=>{
      inp.oninput=()=>{ draft[+inp.dataset.nm].name=inp.value; };
      inp.onkeydown=e=>{ if(e.key==="Enter") apply(); };
    });
    sheet.querySelectorAll("[data-sw]").forEach(b=>{
      b.onclick=()=>{
        const i=+b.dataset.sw;
        const idx=COLORS.indexOf(draft[i].color);
        for(let step=1;step<=COLORS.length;step++){
          const c=COLORS[(idx+step)%COLORS.length];
          if(!draft.some((d,j)=>j!==i&&d.color===c)){ draft[i].color=c; break; }
        }
        paint();
      };
    });
    sheet.querySelectorAll("[data-del]").forEach(b=>{
      b.onclick=()=>{ if(draft.length>1){ draft.splice(+b.dataset.del,1); paint(); } };
    });
    $("#addP").onclick=()=>{ if(draft.length<MAXP){ draft.push({name:"Player "+(draft.length+1),color:free()}); paint(); } };
    $("#applyP").onclick=apply;
    $("#cancelP").onclick=closeModal;
  }

  function apply(){
    const next=draft.map((p,i)=>({
      name:(p.name||"").trim().slice(0,16)||("Player "+(i+1)),
      color:p.color
    }));
    const sameCount=next.length===state.players.length;
    roster=next;
    if(sameCount){
      state.players.forEach((p,i)=>{ p.name=roster[i].name; p.color=roster[i].color; });
      if(state.turn>=state.players.length) state.turn=0;
      render();
      closeModal();
    }else{
      closeModal();
      newGame();
    }
  }
  paint();
}

function rules(){
  openModal(`<button class="x" onclick="closeModal()">×</button>
  <h2>How to play</h2>
  <p class="sub">The same five steps as on the printed board.</p>
  <ol>
    <li>Roll the dice.</li><li>Move your token.</li><li>Draw from the matching stack.</li>
    <li>Complete the task.</li><li>Check your answer.</li>
  </ol>
  <h3>Scoring</h3>
  <ul>
    <li>Correct on the first try — <b>+1</b></li>
    <li>Correct in a full sentence when the card asks for one — <b>+1 bonus</b> (use “Full sentence +2”)</li>
    <li>Two tries and still stuck — <b>0</b>, and the card goes to the bottom of its stack</li>
  </ul>
  <h3>The board</h3>
  <p>Seven stacks, 28 spaces, one closed loop. Landing on <b>START</b> lets you choose any stack.
     The loop has no last square: play until the teacher stops the round.</p>
  <h3>Keys</h3>
  <p><kbd>Space</kbd> roll or reveal · <kbd>1</kbd> correct · <kbd>2</kbd> full sentence · <kbd>3</kbd> try again</p>
  <p style="color:#7E8CA0;font-size:12px">Single HTML file: all 78 cards, the board, the spot characters
     and the illustrations from the printed pack are embedded. Nothing loads from the internet.</p>`);
}

buildBoard();
newGame();
$("#sndBtn").onclick=()=>{
  soundOn=!soundOn;
  $("#sndBtn").setAttribute("aria-pressed",soundOn?"true":"false");
  $("#sndWave").style.opacity=soundOn?1:.15;
  $("#sndBtn").style.color=soundOn?"":"#9AA9BC";
  if(soundOn){ ac(); sfx("card"); }
};
$("#playersBtn").onclick=openPlayers;
$("#jpBtn").onclick=()=>{ state.jp=!state.jp; $("#jpBtn").style.opacity=state.jp?1:.55;
                          $("#jpBtn").title=state.jp?"Japanese on":"Japanese hidden"; renderCard(); };
$("#rulesBtn").onclick=rules;
$("#endBtn").onclick=()=>{ if(state.phase!=="over") endGame(); };
let armed=0;
$("#newBtn").onclick=()=>{
  if(Date.now()-armed<3000){ armed=0; $("#newBtn").textContent="New game"; newGame(); return; }
  armed=Date.now(); $("#newBtn").textContent="Tap again to restart";
  setTimeout(()=>{ if(Date.now()-armed>=3000){ armed=0; $("#newBtn").textContent="New game"; } },3100);
};
$("#modal").onclick=e=>{ if(e.target.id==="modal") closeModal(); };
$("#board").addEventListener("click",e=>{
  if(e.target.closest("#die") && state.phase==="idle") roll();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeModal();
  if($("#modal").classList.contains("on")) return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  if(e.key==="f"||e.key==="F"){ if(fsBtn) fsBtn.click(); return; }
  if(e.code==="Space"||e.key==="Enter"){
    e.preventDefault();
    if(state.phase==="idle") roll();
    else if(state.phase==="question") reveal();
  }
  if(state.phase==="revealed"){
    if(e.key==="1") judge(1);
    if(e.key==="2") judge(2);
    if(e.key==="3") judge(0);
  }
});
